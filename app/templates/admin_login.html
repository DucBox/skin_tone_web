<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">Công cụ chấm màu da</div>
      <h1>Đăng nhập admin</h1>
      <p>Chỉ quản trị viên mới xem toàn bộ lịch sử, xuất Excel và xoá kết quả.</p>
    </header>
    <div class="workspace">
      <aside class="panel sidebar">
        {% include "navigation.html" %}
      </aside>
      <section class="panel results">
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <form class="page-size-form" method="post" action="{{ url_for('admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:16px">
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:16px">
          <button class="primary" type="submit">Đăng nhập</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
